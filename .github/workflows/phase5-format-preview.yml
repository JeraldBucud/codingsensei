name: Phase 5 formatting preview

on:
  push:
    branches:
      - feature/phase-5-project-chat-foundation

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write docs/PHASE5_PROJECT_CHAT.md src/chat/projectChatPrompt.ts tests/projectChatPrompt.test.ts
      - name: Print formatted output
        run: |
          for file in docs/PHASE5_PROJECT_CHAT.md src/chat/projectChatPrompt.ts tests/projectChatPrompt.test.ts; do
            echo "===FORMATTED_START:$file==="
            cat "$file"
            echo "===FORMATTED_END:$file==="
          done
